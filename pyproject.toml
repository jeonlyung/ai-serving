[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-serving"
version = "0.1.0"
description = "오픈소스 LLM 서빙 스택 — vLLM/SGLang/llama.cpp 를 카탈로그 한 장으로 배포·라우팅·관측"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
hf = ["huggingface_hub>=0.24"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
servectl = "servectl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/servectl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "RUF001"]
