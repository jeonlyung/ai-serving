global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
- /etc/prometheus/alerts.yml
scrape_configs:
- job_name: engines
  metrics_path: /metrics
  static_configs:
  - targets:
    - google-gemma-3-27b-it:8000
    labels:
      model: google/gemma-3-27b-it
  - targets:
    - google-gemma-3-4b-it-1:8000
    - google-gemma-3-4b-it-2:8000
    labels:
      model: google/gemma-3-4b-it
  - targets:
    - qwen-qwen3-32b:8000
    labels:
      model: Qwen/Qwen3-32B
- job_name: router
  static_configs:
  - targets:
    - router:8000
- job_name: dcgm
  static_configs:
  - targets:
    - dcgm-exporter:9400
